name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:ssot
      - run: npm run verify:i18n
      - run: npm run verify:a11y
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
